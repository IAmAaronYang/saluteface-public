<svg xmlns="http://www.w3.org/2000/svg" width="760" height="220" viewBox="0 0 760 220" role="img" aria-label="SchemaPilot pipeline: contract to fuzzer, validator, repair, report and matrix">
  <title>SchemaPilot processing pipeline</title>
  <desc>An animated diagram showing a JSON contract flowing through the fuzzer, validator, repair engine, and out to report and matrix stages.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="node2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="760" height="220" rx="14" fill="url(#bg)"/>
  <text x="24" y="34" fill="#e2e8f0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700">SchemaPilot Pipeline</text>

  <line x1="120" y1="118" x2="660" y2="118" stroke="#334155" stroke-width="3"/>
  <line x1="120" y1="118" x2="200" y2="118" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="280" y1="118" x2="360" y2="118" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="440" y1="118" x2="520" y2="118" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <circle r="6" fill="#f472b6">
    <animateMotion dur="4s" repeatCount="indefinite" path="M120,118 L660,118"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="4s" repeatCount="indefinite"/>
  </circle>
