name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python 3.11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Byte-compile package
        run: python -m compileall -q schemapilot
      - name: Inspect contracts
        run: |
          python -m schemapilot inspect schemas/invoice.v1.json
          python -m schemapilot inspect schemas/invoice.v2.json
          python -m schemapilot inspect schemas/telemetry_event.v1.json
      - name: Validate fixtures
        run: |
          python -m schemapilot validate schemas/invoice.v1.json fixtures/invoice_valid.json
      - name: Reports reach full detection accuracy
        run: |
          python - <<'PY'
          from schemapilot.contract import load_contract
          from schemapilot.report import run_report
          for path in ("schemas/invoice.v1.json", "schemas/invoice.v2.json", "schemas/telemetry_event.v1.json"):
              rep = run_report(load_contract(path))
              acc = rep.to_dict()["summary"]["accuracy"]
              assert acc == 1.0, f"{path}: accuracy {acc} < 1.0"
              print(path, "accuracy", acc)
          PY

  dotnet:
    name: .NET 9 runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.0.x"
      - name: Build Release
        run: dotnet build -c Release runtime/SchemaPilot.Runtime.csproj
      - name: Cross-runtime fingerprint parity
        run: |
          set -euo pipefail
          for c in invoice.v1 invoice.v2 telemetry_event.v1; do
            cs=$(dotnet run -c Release --project runtime/SchemaPilot.Runtime.csproj -- fingerprint "schemas/$c.json")
            py=$(python3 -c "import sys;sys.path.insert(0,'.');from schemapilot.contract import load_contract;print(load_contract('schemas/$c.json').fingerprint())")
            echo "$c: cs=$cs py=$py"
            test "$cs" = "$py"
          done
