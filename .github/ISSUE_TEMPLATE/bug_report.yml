name: Bug report
description: Report a SaluteFace bug
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include commands and input data where possible.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: SaluteFace version
      placeholder: "0.3.0"
