[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "schemapilot"
version = "1.0.1"
description = "Structured Output Contract Fuzzer — deterministic payload generation, validation, repair, and compatibility matrices."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SchemaPilot contributors" }]
keywords = [
    "contract",
    "schema",
    "fuzzer",
    "validation",
    "structured-output",
    "compatibility",
    "deterministic",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/bramrahanddian/SchemaPilot"
Documentation = "https://github.com/bramrahanddian/SchemaPilot/tree/main/docs"
Repository = "https://github.com/bramrahanddian/SchemaPilot"
Changelog = "https://github.com/bramrahanddian/SchemaPilot/blob/main/CHANGELOG.md"

[project.scripts]
schemapilot = "schemapilot.cli:main"

[tool.setuptools]
packages = ["schemapilot"]

[tool.setuptools.package-data]
schemapilot = ["py.typed"]
