[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "schemapilot"
version = "1.0.1"
description = "Structured Output Contract Fuzzer — deterministic payload generation, validation, repair, and compatibility matrices."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SchemaPilot contributors" }]
keywords = [
    "contract",
    "schema",
    "fuzzer",
    "validation",
    "structured-output",
    "compatibility",
